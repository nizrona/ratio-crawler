name: Generate KAIST Chart PPT

on:
  push:
    paths:
      - 'gpt_stat/**'
  workflow_dispatch:

# 깃허브 저장소에 파일을 커밋/푸시할 수 있는 쓰기 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl python-pptx

      - name: Run script
        working-directory: ./gpt_stat
        run: |
          python make_chart.py

      # 생성된 PPTX를 저장소(git)에 직접 자동 커밋 및 푸시
      - name: Commit and push generated PPTX
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gpt_stat/*.pptx
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate PPTX chart [skip ci]" && git push)

      # 기존처럼 Artifacts로도 다운로드 가능하도록 유지
      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIST_수시지원자_비교_PPT
          path: gpt_stat/KAIST_2026_2027_수시지원자_비교.pptx
          retention-days: 14
