name: Generate KAIST Chart PPT

on:
  push:
    paths:
      - 'gpt_stat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 한글 폰트, 리브레오피스(PPTX->PDF), poppler(PDF->이미지 변환 도구) 설치
      - name: Install System Dependencies (Fonts, LibreOffice, Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum libreoffice poppler-utils

      # 파이썬 패키지 설치
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl python-pptx pdf2image Pillow

      # 스크립트 실행 (PPTX 생성 및 이미지 변환)
      - name: Run script
        working-directory: ./gpt_stat
        run: |
          python make_chart.py

      # 생성된 PPTX와 슬라이드별 이미지 파일(gpt_stat/images) 저장소에 커밋/푸시
      - name: Commit and push generated PPTX & Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gpt_stat/*.pptx gpt_stat/images/*.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate PPTX and Images [skip ci]" && git push)

      # PPTX 및 이미지 아티팩트 보관
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KAIST_수시지원자_비교_PPT_및_이미지
          path: |
            gpt_stat/KAIST_2026_2027_수시지원자_비교.pptx
            gpt_stat/images/
          retention-days: 14
