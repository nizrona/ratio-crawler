name: Generate KAIST Chart PPT

on:
  push:
    paths:
      - 'make_chart.py'
      - 'KAIST_수시_경쟁률_입력데이터.xlsx'
  workflow_dispatch: # Actions 탭에서 수동 실행 지원

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: |
          python make_chart.py

      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIST_수시지원자_비교_PPT
          path: KAIST_2026_2027_수시지원자_비교.pptx
          retention-days: 14
