name: Generate KAIST Chart PPT

on:
  push:
    paths:
      - 'gpt_stat/**'        # gpt_stat 폴더 안의 파일이 바뀔 때 자동 실행
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼 지원

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 한글 폰트(나눔글꼴) 설치
      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      # 필요한 파이썬 라이브러리 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl python-pptx

      # gpt_stat 폴더 안으로 이동해서 스크립트 실행
      - name: Run script
        working-directory: ./gpt_stat
        run: |
          python make_chart.py

      # 생성된 PPTX 결과물 다운로드용 아티팩트 업로드
      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAIST_수시지원자_비교_PPT
          path: gpt_stat/KAIST_2026_2027_수시지원자_비교.pptx
          retention-days: 14
