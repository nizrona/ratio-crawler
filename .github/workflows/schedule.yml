name: Daily Screenshot Capture

on:
  schedule:
    - cron: '0 9 * * *'  # 한국 시간 매일 18:00 (UTC 09:00)
  workflow_dispatch:      # 수동 테스트 실행 버튼

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 캡처 이미지를 깃허브에 저장할 수 있는 쓰기 권한
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run capture script
        run: python capture.py

      - name: Commit and push screenshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add screenshots/
          git commit -m "Add daily screenshot: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
