name: Daily Screenshot Capture

on:
  schedule:
    - cron: '1 9 * * *'   # 한국 시간 매일 18:05 (UTC 09:05)
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 한글 나눔 폰트 설치 단계 추가
      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk
          sudo fc-cache -fv

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run capture script
        run: python capture.py

      - name: Commit and push screenshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add screenshots/
          git commit -m "Add daily screenshot: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
